<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1200px; height: 630px; overflow: hidden; }

    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      font-family: 'Noto Sans', Arial, sans-serif;
    }

    /* Foto di sfondo */
    .bg {
      position: absolute;
      inset: 0;
      background-image: url('https://effataitalia.it/wp-content/uploads/2026/03/video-Silvia-1024x768-1.jpg');
      background-size: cover;
      background-position: center top;
    }

    /* Overlay gradiente scuro */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(16,16,14,0.78) 0%,
        rgba(16,16,14,0.50) 55%,
        rgba(16,16,14,0.05) 100%
      );
    }

    /* Contenuto testo */
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 70px;
      max-width: 680px;
    }

    .logo {
      width: 70px;
      margin-bottom: 30px;
    }

    .tag {
      display: inline-block;
      background: #ed1c23;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 7px 18px;
      margin-bottom: 22px;
      width: fit-content;
    }

    h1 {
      color: #ffffff;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    h1 span {
      color: #ff3333;
      background: #10100e;
      padding: 0 6px;
      border-radius: 3px;
    }

    .sub {
      color: rgba(255,255,255,0.75);
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: #ed1c23;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .badge-text {
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Numero decorativo in basso a destra */
    .nl-number {
      position: absolute;
      bottom: 40px;
      right: 60px;
      text-align: right;
    }
    .nl-number .n {
      font-size: 120px;
      font-weight: 900;
      color: rgba(255,255,255,0.06);
      line-height: 1;
      font-family: 'Noto Sans', Arial, sans-serif;
    }
    .nl-number .label {
      font-size: 12px;
      color: rgba(255,255,255,0.30);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="content">
    <img class="logo" src="https://effataitalia.it/wp-content/uploads/2026/03/logo1.png" alt="Effata">
    <div class="tag">Uganda 2025</div>
    <h1>Un anno di<br><span>miracoli</span><br>fatti insieme</h1>
    <p class="sub">Silvia Marcolin racconta i risultati<br>che il tuo sostegno ha reso possibili</p>
    <div class="badge">
      <div class="badge-dot"></div>
      <div class="badge-text">Newsletter N.1 &bull; 2026</div>
    </div>
  </div>

  <div class="nl-number">
    <div class="n">1</div>
    <div class="label">Newsletter</div>
  </div>
</div>
</body>
</html>
